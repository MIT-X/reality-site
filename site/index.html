<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="个人网盘登录页面。">
<title>我的网盘 · 登录</title>
<style>
/* 配色、字体、间距可在这里修改；不依赖外部字体或框架。 */
* {
  box-sizing:border-box}
body {
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f3ed;
  color:#26332b;
  font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;
  line-height:1.9;
  padding:28px}
.card {
  width:100%;
  max-width:420px;
  background:#fff;
  border:1px solid #d9ddd1;
  border-radius:18px;
  padding:44px 38px;
  box-shadow:0 18px 40px rgba(38,51,43,.10)}
.brand {
  text-align:center;
  margin-bottom:30px}
.logo {
  width:54px;
  height:54px;
  margin:0 auto 14px;
  border-radius:14px;
  background:#39593d;
  color:#f5f3ed;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px}
small {
  letter-spacing:.18em;
  color:#66775d}
h1 {
  font-size:28px;
  margin:10px 0 6px;
  line-height:1.3}
.subtitle {
  margin:0;
  color:#52604e;
  font-size:15px}
.field {
  margin-bottom:20px}
label {
  display:block;
  font-size:14px;
  font-weight:600;
  margin-bottom:8px;
  color:#39493d}
.input-wrap {
  position:relative}
input[type="text"],
input[type="password"] {
  width:100%;
  height:46px;
  padding:0 14px;
  border:1px solid #c9cfc1;
  border-radius:10px;
  background:#fbfaf6;
  color:#26332b;
  font-size:15px;
  font-family:inherit;
  outline:none;
  transition:border-color .2s, box-shadow .2s}
input[type="text"]:focus,
input[type="password"]:focus {
  border-color:#39593d;
  box-shadow:0 0 0 3px rgba(57,89,61,.15)}
.toggle-pwd {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:#66775d;
  font-size:13px;
  cursor:pointer;
  padding:6px}
.row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:4px 0 24px;
  font-size:14px}
.remember {
  display:flex;
  align-items:center;
  gap:8px;
  color:#52604e;
  cursor:pointer}
.remember input {
  accent-color:#39593d}
a {
  color:#39593d;
  text-underline-offset:5px}
.btn {
  width:100%;
  height:48px;
  border:none;
  border-radius:10px;
  background:#39593d;
  color:#f5f3ed;
  font-size:16px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  transition:background .2s}
.btn:hover {
  background:#2d4731}
.tip {
  margin-top:18px;
  text-align:center;
  font-size:13px;
  color:#73806c}
.error {
  display:none;
  margin-bottom:16px;
  padding:10px 14px;
  border-radius:10px;
  background:#fbeceb;
  color:#8a3a35;
  font-size:14px}
footer {
  margin-top:30px;
  text-align:center;
  color:#73806c;
  font-size:13px}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="brand">
      <div class="logo">☁</div>
      <small>PERSONAL CLOUD</small>
      <h1>我的网盘</h1>
    </div>

    <div class="error" id="errorTip"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="account">帐号</label>
        <div class="input-wrap">
          <input type="text" id="account" name="account" placeholder="请输入帐号" autocomplete="username">
        </div>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password">
          <button type="button" class="toggle-pwd" id="togglePwd">显示</button>
        </div>
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" id="remember"> 记住帐号
        </label>
      </div>

      <button type="submit" class="btn">登 录</button>


    </form>
  </div>
  <footer>我的网盘 · Personal Cloud Drive</footer>
</main>

<script>
// 纯前端演示：仅做输入校验与提示，不连接真实后端。
var form = document.getElementById('loginForm');
var account = document.getElementById('account');
var password = document.getElementById('password');
var errorTip = document.getElementById('errorTip');
var togglePwd = document.getElementById('togglePwd');

togglePwd.addEventListener('click', function () {
  var isPwd = password.type === 'password';
  password.type = isPwd ? 'text' : 'password';
  togglePwd.textContent = isPwd ? '隐藏' : '显示';
});

form.addEventListener('submit', function (e) {
  e.preventDefault();
  errorTip.style.display = 'none';
  if (!account.value.trim()) {
    showError('请输入帐号。');
    account.focus();
    return;
  }
  if (!password.value) {
    showError('请输入密码。');
    password.focus();
    return;
  }
  if (password.value.length < 6) {
    showError('密码长度至少为 6 位。');
    password.focus();
    return;
  }
  // 登录错误：请检查帐号或者密码。
  showError('登录错误：请检查帐号或者密码');
  errorTip.style.background = '#eef3ea';
  errorTip.style.color = '#39593d';
});

function showError(msg) {
  errorTip.textContent = msg;
  errorTip.style.background = '#fbeceb';
  errorTip.style.color = '#8a3a35';
  errorTip.style.display = 'block';
}
</script>
</body>
</html>
